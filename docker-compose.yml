services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/the-anonymous-aspirant/aspirant-server:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      GIN_MODE: "release"
      TRANSCRIBER_URL: http://transcriber:8000
      COMMANDER_URL: http://commander:8000
      TRANSLATOR_URL: http://translator:8000
      MONITOR_URL: http://monitor:8000
      KIWIX_URL: http://kiwix:8080
      REMARKABLE_URL: http://remarkable:8000
      FINANCE_URL: http://finance:8000
      ADVISOR_URL: http://advisor:8000
      ASSET_BASE_PATH: /data/assets
    env_file:
      - .env
    volumes:
      - /data/aspirant/files:/data/files
      - /data/aspirant/assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy

  # Blue-green client: port 80 assigned via docker-compose.override.yml
  # Deploy with: ./scripts/deploy-client.sh
  client-blue:
    image: ghcr.io/the-anonymous-aspirant/aspirant-client:latest
    restart: unless-stopped

  client-green:
    image: ghcr.io/the-anonymous-aspirant/aspirant-client:latest
    restart: unless-stopped

  transcriber:
    image: ghcr.io/the-anonymous-aspirant/aspirant-transcriber:latest
    restart: unless-stopped
    ports:
      - "8082:8000"
    env_file:
      - .env
    environment:
      AUDIO_STORAGE_PATH: /data/audio
      WHISPER_MODEL: base
    volumes:
      - /data/aspirant/audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  commander:
    image: ghcr.io/the-anonymous-aspirant/aspirant-commander:latest
    restart: unless-stopped
    ports:
      - "8083:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  translator:
    image: ghcr.io/the-anonymous-aspirant/aspirant-translator:latest
    restart: unless-stopped
    ports:
      - "8084:8000"
    volumes:
      - /data/aspirant/models:/data/models
    mem_limit: 2g

  monitor:
    image: ghcr.io/the-anonymous-aspirant/aspirant-monitor:latest
    restart: unless-stopped
    ports:
      - "8085:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data:/host/data:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-8}

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    restart: unless-stopped
    environment:
      PORT: 8080
    command: --urlRootLocation=/api/wikipedia /data/wikipedia_en_all_maxi_2026-02.zim
    volumes:
      - /data/aspirant/kiwix:/data:ro

  remarkable:
    image: ghcr.io/the-anonymous-aspirant/aspirant-remarkable:latest
    restart: unless-stopped
    ports:
      - "8086:8000"
    volumes:
      - /data/aspirant/remarkable:/data/remarkable
    mem_limit: 2g

  finance:
    image: ghcr.io/the-anonymous-aspirant/aspirant-finance:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8087:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - /data/aspirant/finance/seed_data:/app/seed_data:ro
    depends_on:
      postgres:
        condition: service_healthy

  advisor:
    image: ghcr.io/the-anonymous-aspirant/aspirant-advisor:latest
    restart: unless-stopped
    ports:
      - "8088:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      OLLAMA_URL: http://ollama:11434
    volumes:
      - /data/aspirant/advisor:/data/advisor
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  browser:
    image: ghcr.io/the-anonymous-aspirant/aspirant-browser:latest
    restart: unless-stopped
    ports:
      - "8089:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      BROWSER_FLOW_DATA_DIR: /data/aspirant/browser_flows
      TOR_SOCKS_URL: socks5://tor:9050
    volumes:
      - /data/aspirant/files:/data/files
      - /data/aspirant/browser_flows:/data/aspirant/browser_flows
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    mem_limit: 2g

  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    mem_limit: 256m

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - /data/aspirant/ollama:/root/.ollama
    mem_limit: 6g

volumes:
  pgdata:
