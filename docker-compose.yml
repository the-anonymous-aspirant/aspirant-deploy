services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env — generate with: openssl rand -base64 32}"
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bind to loopback: DB is reachable to compose peers via internal
      # DNS (`postgres:5432`) and to the cell host via localhost. Never
      # exposed to LAN. See system_3 #1379.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/the-anonymous-aspirant/aspirant-server:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      GIN_MODE: "release"
      TRANSCRIBER_URL: http://transcriber:8000
      COMMANDER_URL: http://commander:8000
      TRANSLATOR_URL: http://translator:8000
      MONITOR_URL: http://monitor:8000
      KIWIX_URL: http://kiwix:8080
      REMARKABLE_URL: http://remarkable:8000
      FINANCE_URL: http://finance:8000
      ADVISOR_URL: http://advisor:8000
      ASSET_BASE_PATH: /data/assets
    env_file:
      - .env
    volumes:
      - /data/aspirant/files:/data/files
      - /data/aspirant/assets:/data/assets
    depends_on:
      postgres:
        condition: service_healthy

  # Blue-green client: port 80 assigned via docker-compose.override.yml
  # Deploy with: ./scripts/deploy-client.sh
  client-blue:
    image: ghcr.io/the-anonymous-aspirant/aspirant-client:latest
    restart: unless-stopped

  client-green:
    image: ghcr.io/the-anonymous-aspirant/aspirant-client:latest
    restart: unless-stopped

  transcriber:
    image: ghcr.io/the-anonymous-aspirant/aspirant-transcriber:latest
    restart: unless-stopped
    ports:
      # Loopback publish only. Ingress runs through aspirant-server's
      # authenticated /api proxy on the internal compose network. See
      # system_3 #1379.
      - "127.0.0.1:8082:8000"
    env_file:
      - .env
    environment:
      AUDIO_STORAGE_PATH: /data/audio
      WHISPER_MODEL: base
    volumes:
      - /data/aspirant/audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  commander:
    image: ghcr.io/the-anonymous-aspirant/aspirant-commander:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  translator:
    image: ghcr.io/the-anonymous-aspirant/aspirant-translator:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8000"
    volumes:
      - /data/aspirant/models:/data/models
    mem_limit: 2g

  # Read-only Docker API gateway for the network-published monitor
  # container. Holds the docker.sock bind mount so `monitor` does not.
  # Attached only to `docker_proxy_net`, which is not routed to the host
  # (no `ports:` map), so a compromised published container cannot reach
  # the socket. Allowlist is minimal: CONTAINERS (for /containers/json,
  # inspect, and stats) + SYSTEM (for /system/df) + the default PING.
  # POST=0 (default) blocks every write verb, so the socket cannot be
  # used to launch a privileged container. See system_3 #1378.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SYSTEM: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_proxy_net
    read_only: true
    tmpfs:
      - /run
    mem_limit: 64m

  monitor:
    image: ghcr.io/the-anonymous-aspirant/aspirant-monitor:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8000"
    volumes:
      - /data:/host/data:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      DOCKER_SOCKET: tcp://docker-socket-proxy:2375
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-8}
    networks:
      - default
      - docker_proxy_net
    depends_on:
      - docker-socket-proxy

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    restart: unless-stopped
    environment:
      PORT: 8080
    command: --urlRootLocation=/api/wikipedia /data/wikipedia_en_all_maxi_2026-02.zim
    volumes:
      - /data/aspirant/kiwix:/data:ro

  remarkable:
    image: ghcr.io/the-anonymous-aspirant/aspirant-remarkable:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8000"
    volumes:
      - /data/aspirant/remarkable:/data/remarkable
    mem_limit: 2g

  finance:
    image: ghcr.io/the-anonymous-aspirant/aspirant-finance:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - /data/aspirant/finance/seed_data:/app/seed_data:ro
    depends_on:
      postgres:
        condition: service_healthy

  advisor:
    image: ghcr.io/the-anonymous-aspirant/aspirant-advisor:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      OLLAMA_URL: http://ollama:11434
    volumes:
      - /data/aspirant/advisor:/data/advisor
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  browser:
    image: ghcr.io/the-anonymous-aspirant/aspirant-browser:latest
    restart: unless-stopped
    # Intentionally no host `ports:` mapping. aspirant-browser is reached
    # only through aspirant-server on the internal compose network:
    #   client(nginx) -> server:8080 -> browser:8000
    # Both the JSON API (/api/browser-flows*, /api/jobs*) and the matrix
    # HTML (/browser-flows*) require an authenticated JWT via server's
    # Admin/Trusted gate + nginx auth_request. Publishing 0.0.0.0:8089
    # would bypass all of it. See system_3 #1375.
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      BROWSER_FLOW_DATA_DIR: /data/aspirant/browser_flows
      TOR_SOCKS_URL: socks5://tor:9050
      # Silences /docs, /redoc, /openapi.json, and the uvicorn `Server`
      # header per system_3 #1444. Dev compose intentionally omits the
      # override so onboarding + curl testing keep working.
      BROWSER_ENV: production
    volumes:
      - /data/aspirant/files:/data/files
      - /data/aspirant/browser_flows:/data/aspirant/browser_flows
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    mem_limit: 2g

  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    mem_limit: 256m

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - /data/aspirant/ollama:/root/.ollama
    mem_limit: 6g

volumes:
  pgdata:

networks:
  default:
  # Internal-only bridge used by monitor to reach docker-socket-proxy.
  # Never mapped to the host. See docker-socket-proxy service comment.
  docker_proxy_net:
    internal: true
