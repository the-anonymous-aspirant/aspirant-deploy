services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env — generate with: openssl rand -base64 32}"
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bind to loopback: DB is reachable to compose peers via internal
      # DNS (`postgres:5432`) and to the cell host via localhost. Never
      # exposed to LAN. See system_3 #1379.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/the-anonymous-aspirant/aspirant-server:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      GIN_MODE: "release"
      TRANSCRIBER_URL: http://transcriber:8000
      COMMANDER_URL: http://commander:8000
      TRANSLATOR_URL: http://translator:8000
      MONITOR_URL: http://monitor:8000
      KIWIX_URL: http://kiwix:8080
      REMARKABLE_URL: http://remarkable:8000
      FINANCE_URL: http://finance:8000
      ADVISOR_URL: http://advisor:8000
      ASSET_BASE_PATH: /data/assets
      # Refuse to boot on unset JWT_SECRET. The aspirant-server binary
      # additionally rejects known-placeholder / short values at start.
      # See system_3 #1374.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env — generate with: openssl rand -base64 32}"
    env_file:
      - .env
    volumes:
      - /data/aspirant/files:/data/files
      - /data/aspirant/assets:/data/assets
    # `condition: service_healthy` is honored by `docker compose up` only.
    # On a HOST REBOOT the Docker daemon restarts unless-stopped containers
    # in parallel and ignores depends_on ordering, so server can start ahead
    # of postgres — the #2660 DB-init race, which fired despite this block
    # being here since the initial commit. The real reboot-race guard is
    # app-level fail-fast (server log.Fatal's on DB-init failure so the
    # restart policy retries), NOT depends_on. Same caveat applies to every
    # service_healthy dependency below. See docs/DECISIONS.md.
    depends_on:
      postgres:
        condition: service_healthy

  # Blue-green client: port 80 assigned via docker-compose.override.yml
  # Deploy with: ./scripts/deploy-client.sh
  client-blue:
    image: ghcr.io/the-anonymous-aspirant/aspirant-client:latest
    restart: unless-stopped
    volumes:
      # system_3 #3019-B5: nginx auth-secret drop-in dir. Both slots mount
      # the SAME host path so a blue<->green flip keeps the secret. Inert
      # while the dir carries no *.conf; the secret lands at the operator's
      # B4 flip. Read-only: the client must never write secrets.
      - /data/aspirant/nginx-secrets:/etc/nginx/secrets:ro

  client-green:
    image: ghcr.io/the-anonymous-aspirant/aspirant-client:latest
    restart: unless-stopped
    volumes:
      - /data/aspirant/nginx-secrets:/etc/nginx/secrets:ro

  transcriber:
    image: ghcr.io/the-anonymous-aspirant/aspirant-transcriber:latest
    restart: unless-stopped
    ports:
      # Loopback publish only. Ingress runs through aspirant-server's
      # authenticated /api proxy on the internal compose network. See
      # system_3 #1379.
      - "127.0.0.1:8082:8000"
    env_file:
      - .env
    environment:
      AUDIO_STORAGE_PATH: /data/audio
      WHISPER_MODEL: base
    volumes:
      - /data/aspirant/audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  commander:
    image: ghcr.io/the-anonymous-aspirant/aspirant-commander:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  translator:
    image: ghcr.io/the-anonymous-aspirant/aspirant-translator:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8000"
    volumes:
      - /data/aspirant/models:/data/models
    mem_limit: 2g

  # Read-only Docker API gateway for the network-published monitor
  # container. Holds the docker.sock bind mount so `monitor` does not.
  # Attached only to `docker_proxy_net`, which is not routed to the host
  # (no `ports:` map), so a compromised published container cannot reach
  # the socket. Allowlist is minimal: CONTAINERS (for /containers/json,
  # inspect, and stats) + SYSTEM (for /system/df) + the default PING.
  # POST=0 (default) blocks every write verb, so the socket cannot be
  # used to launch a privileged container. See system_3 #1378.
  docker-socket-proxy:
    # Pinned to a specific tag (not :latest) because this container runs
    # read_only:true — an upstream manifest change that writes to a path
    # not listed under `tmpfs:` crash-loops the sidecar (cell hit
    # RestartCount 5490x when v0.4.x drifted in behind :latest and its
    # HAProxy entrypoint tried to write /tmp/haproxy.cfg). Bump the tag
    # in a PR after verifying the new version's writable-path set.
    image: tecnativa/docker-socket-proxy:v0.4.2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      SYSTEM: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_proxy_net
    read_only: true
    tmpfs:
      # /run — allowlist file used by the entrypoint.
      # /tmp — HAProxy config written by v0.4.x entrypoints.
      - /run
      - /tmp
    mem_limit: 64m

  monitor:
    image: ghcr.io/the-anonymous-aspirant/aspirant-monitor:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8000"
    volumes:
      - /data:/host/data:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      DOCKER_SOCKET: tcp://docker-socket-proxy:2375
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-8}
    networks:
      - default
      - docker_proxy_net
    depends_on:
      - docker-socket-proxy

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    restart: unless-stopped
    environment:
      PORT: 8080
    command: --urlRootLocation=/api/wikipedia /data/wikipedia_en_all_maxi_2026-02.zim
    volumes:
      - /data/aspirant/kiwix:/data:ro

  remarkable:
    image: ghcr.io/the-anonymous-aspirant/aspirant-remarkable:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8000"
    volumes:
      - /data/aspirant/remarkable:/data/remarkable
    mem_limit: 2g

  finance:
    image: ghcr.io/the-anonymous-aspirant/aspirant-finance:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - /data/aspirant/finance/seed_data:/app/seed_data:ro
    depends_on:
      postgres:
        condition: service_healthy

  advisor:
    image: ghcr.io/the-anonymous-aspirant/aspirant-advisor:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      OLLAMA_URL: http://ollama:11434
    volumes:
      - /data/aspirant/advisor:/data/advisor
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  browser:
    image: ghcr.io/the-anonymous-aspirant/aspirant-browser:latest
    restart: unless-stopped
    # Intentionally no host `ports:` mapping. aspirant-browser is reached
    # only through aspirant-server on the internal compose network:
    #   client(nginx) -> server:8080 -> browser:8000
    # Both the JSON API (/api/browser-flows*, /api/jobs*) and the matrix
    # HTML (/browser-flows*) require an authenticated JWT via server's
    # Admin/Trusted gate + nginx auth_request. Publishing 0.0.0.0:8089
    # would bypass all of it. See system_3 #1375.
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      BROWSER_FLOW_DATA_DIR: /data/aspirant/browser_flows
      TOR_SOCKS_URL: socks5://tor:9050
      # Silences /docs, /redoc, /openapi.json, and the uvicorn `Server`
      # header per system_3 #1444. Dev compose intentionally omits the
      # override so onboarding + curl testing keep working.
      BROWSER_ENV: production
    volumes:
      - /data/aspirant/files:/data/files
      - /data/aspirant/browser_flows:/data/aspirant/browser_flows
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    mem_limit: 2g

  tor:
    image: dperson/torproxy:latest
    restart: unless-stopped
    mem_limit: 256m

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - /data/aspirant/ollama:/root/.ollama
    mem_limit: 6g

  # Histoire component workbench (system_3 #2218): static build of
  # aspirant-design-system stories, served by nginx at /admin/histoire/
  # (the base path is baked into the image — the client-nginx location
  # proxies without rewriting). Published to GHCR by the DS repo's
  # pre-push hook on every push to main; the auto-pull cron deploys it
  # unattended. No ports: reached only via client-nginx (auth_request-
  # gated) on the default network; /health per the service contract.
  histoire:
    image: ghcr.io/the-anonymous-aspirant/aspirant-histoire:latest
    restart: unless-stopped
    mem_limit: 128m

  # --- Penpot design service (system_3 #2195) -------------------------------
  # Third-party design tool, migrated from the dev box. Runs on its own
  # `penpot` bridge with a dedicated postgres:15 + redis:7 (NOT the shared
  # pgvector/pg16 instance — see docs/DECISIONS.md). Images are GHCR
  # mirrors of the dev-box-proven upstream digests (the cell cannot pull
  # docker.io over its Wi-Fi uplink — see docs/DECISIONS.md; upstream
  # sources: penpotapp/{frontend,backend,exporter}:2.16.2 @ 4725b4 / 6c8e38
  # / b370f1, library/postgres:15 @ bcab09, library/redis:7 @ b2b956),
  # digest-pinned so the auto-pull cron is a no-op for these services.
  # Public access lands via the client-nginx /admin/penpot/ location on
  # the apex (Cloudflare TLS, admin auth_request — system_3 #2198); the
  # frontend is therefore on `default` as well, and only loopback-published
  # for on-cell debug.
  penpot-frontend:
    image: ghcr.io/the-anonymous-aspirant/penpot-frontend:2.16.2@sha256:7bcd6d8ffa333054906cde55f6e9da9936a19b2ab30d2b50cb263d44e7740c7b
    restart: unless-stopped
    ports:
      # Loopback publish only, for on-cell debug/verification. Public
      # ingress runs through the client-nginx /admin/penpot/ location
      # on the internal compose network. See system_3 #1379.
      - "127.0.0.1:9001:8080"
    depends_on:
      penpot-backend:
        condition: service_started
      penpot-exporter:
        condition: service_started
    networks:
      - default
      - penpot
    mem_limit: 512m

  penpot-backend:
    image: ghcr.io/the-anonymous-aspirant/penpot-backend:2.16.2@sha256:c322cb8f864dc8c23ab033883c22e8b2e11ffb03cb63bede249b21ca6d56f6b4
    restart: unless-stopped
    volumes:
      - /data/aspirant/penpot/assets:/opt/data/assets
    environment:
      # No disable-secure-session-cookies (the dev-box stack needed it for
      # plain-HTTP tunnel access): the public origin is HTTPS via
      # Cloudflare, so session cookies stay Secure. enable-prepl-server
      # keeps manage.py admin access (docker exec only; the PREPL port is
      # bound to localhost inside the container).
      PENPOT_FLAGS: enable-login-with-password enable-access-tokens disable-registration disable-email-verification disable-telemetry enable-prepl-server
      PENPOT_SECRET_KEY: "${PENPOT_SECRET_KEY:?PENPOT_SECRET_KEY must be set in .env — migrate the dev-box value; regenerating invalidates sessions and signed URLs}"
      # Path-bearing on purpose (system_3 #2198): Penpot mounts under the
      # apex admin path. Verified on 2.16.2 — cookies, CORS, websocket and
      # signed asset URLs all honor the path (spike, #2198 comment 8700).
      PENPOT_PUBLIC_URI: https://the-aspirant.com/admin/penpot/
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: "${PENPOT_DB_PASSWORD:?PENPOT_DB_PASSWORD must be set in .env — migrate the dev-box value}"
      PENPOT_REDIS_URI: redis://penpot-redis/0
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-redis:
        condition: service_started
    networks:
      - penpot
    mem_limit: 2g

  penpot-exporter:
    image: ghcr.io/the-anonymous-aspirant/penpot-exporter:2.16.2@sha256:7f4cc034d9366627d7c8e222a70fbbeacc88ad4ee8dd5bc2302ad83b77c2d148
    restart: unless-stopped
    environment:
      # Must match the backend's key; the exporter validates signed export
      # requests with it. The URI is the internal frontend, not the public
      # origin — the exporter's headless chromium renders in-network.
      PENPOT_SECRET_KEY: "${PENPOT_SECRET_KEY:?PENPOT_SECRET_KEY must be set in .env}"
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-redis/0
    networks:
      - penpot
    mem_limit: 2g

  penpot-postgres:
    image: ghcr.io/the-anonymous-aspirant/penpot-postgres:15@sha256:1439cab601c7157f909d6e85b096adc81264bba698b40ad163c15cf4bcad74bb
    restart: unless-stopped
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: "${PENPOT_DB_PASSWORD:?PENPOT_DB_PASSWORD must be set in .env}"
    volumes:
      - /data/aspirant/penpot/postgres:/var/lib/postgresql/data
    networks:
      - penpot
    mem_limit: 1g

  penpot-redis:
    image: ghcr.io/the-anonymous-aspirant/penpot-redis:7@sha256:33d3a320585c78a71f509c68284a3423a0d790380931829e8abac44aaa31b8c0
    restart: unless-stopped
    networks:
      - penpot
    mem_limit: 256m

  # --- Explorer (system_3 #2409-D2) ----------------------------------------
  # The authenticated browse surface over the data lake. Two services: a static
  # SPA and an API. Only the API touches the lake, and it is the ONLY thing in
  # this project that does.
  #
  # THE BOUNDARY, because this is the one place it is crossed.
  #
  # Operator ruling 2026-07-20: "The lake itself should not be visible to the
  # public api. However, the explorer should, for a user that has logged in, be
  # able to reveal a google-drive-like interaction and view of the data in the
  # data lake."
  #
  # That is a rule about REACHABILITY, not about network membership:
  #   permitted — the public reaches the explorer API; the explorer API reaches
  #               the lake. Two different reachability facts.
  #   forbidden — any lake service (garage, catalog) reachable from the public
  #               ingress by ANY route. No proxy pass-through, no port publish,
  #               no temporary debug route. If a request from the internet can
  #               reach a lake port, this is violated whatever the file says.
  #
  # The shape is the one penpot-frontend already uses above: a single mediating
  # container dual-homed onto `default`, with everything behind it reachable
  # only from its own bridge. Neither service publishes a port; public ingress
  # is the client-nginx /admin/explorer/ location behind auth_request (#2409-D3).
  #
  # WHY THESE ARE `:-` AND NOT `:?` (system_3 #2556).
  #
  # They were `${VAR:?...}` for one commit. A required-variable failure is not
  # scoped to its service -- it aborts interpolation of the WHOLE FILE, so on
  # any host without explorer credentials every `docker compose pull|up|ps`
  # fails, including the ones auto-pull.sh runs. That takes out the deploy path
  # for every unrelated service, and the mechanism needed to fix it remotely.
  # Measured on the cell: `required variable EXPLORER_S3_ACCESS_KEY is missing`.
  #
  # `profiles:` alone does NOT save this -- verified, not assumed: interpolation
  # runs before profile filtering, so a `:?` inside a profiled service still
  # aborts the file. The inert default is the load-bearing part; the profile is
  # what stops the services starting where nobody asked for them.
  #
  # The failure now lands where it belongs: with no credentials the API starts
  # and reports `degraded`, one service, visibly, instead of silently wedging
  # the host.
  explorer-api:
    image: ghcr.io/the-anonymous-aspirant/aspirant-explorer:latest
    restart: unless-stopped
    # Opt-in: `docker compose --profile explorer up -d`. Until a host is
    # deliberately running the explorer, these two services are inert.
    profiles: ["explorer"]
    environment:
      LAKE_CATALOG_DSN: ${LAKE_CATALOG_DSN:-}
      LAKE_S3_ENDPOINT: garage:3900
      LAKE_S3_BUCKET: ${LAKE_S3_BUCKET:-lake-skeleton-bronze}
      LAKE_S3_REGION: garage
      # Read-only Garage key. The bridge is only bounded if the CREDENTIALS are
      # bounded — §9's access model says "explorer API and BI hold read-only
      # keys". A read-write key here would grant a mediated write path where a
      # mediated read path was authorised. Provisioning is #2409-D4.
      AWS_ACCESS_KEY_ID: ${EXPLORER_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${EXPLORER_S3_SECRET_KEY:-}
    networks:
      - default
      - lake
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 512m

  # Static SPA. Deliberately NOT on `lake`: it runs in the browser and talks to
  # the API over the same authed origin, so giving it a lake interface would
  # widen the boundary for nothing.
  explorer:
    image: ghcr.io/the-anonymous-aspirant/aspirant-explorer-frontend:latest
    restart: unless-stopped
    profiles: ["explorer"]
    depends_on:
      explorer-api:
        condition: service_healthy
    networks:
      - default
    mem_limit: 128m

volumes:
  pgdata:

networks:
  default:
  # The lake skeleton's bridge, created by docker-compose.lake-skeleton.yml and
  # joined here as external — it is a separate compose project, so declaring it
  # rather than defining it is what attaches to the SAME bridge instead of
  # silently creating a second, empty one named alike.
  #
  # This is the ONE mediated exception to the lake's isolation (see the
  # explorer-api comment above and #2409). It is scoped and it EXPIRES: the
  # permission holds only while the skeleton carries synthetic fixtures on a
  # scratch volume, and must be re-derived before real data lands — the same
  # trigger DATA_LAKE_DESIGN.md §11.0 rev 3b already defines for encryption. A
  # permission that expires on a condition nobody recorded is a permanent
  # permission, which is why the condition is written here and not in a thread.
  lake:
    external: true
    name: aspirant-lake-skeleton_lake
  # Internal-only bridge used by monitor to reach docker-socket-proxy.
  # Never mapped to the host. See docker-socket-proxy service comment.
  docker_proxy_net:
    internal: true
  # Penpot sub-stack bridge. Only penpot-frontend is dual-homed onto
  # `default` (for the client-nginx vhost proxy); backend, exporter,
  # postgres and redis are reachable solely from penpot peers.
  penpot:
