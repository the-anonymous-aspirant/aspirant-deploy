services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env — generate with: openssl rand -base64 32}"
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      # Loopback publish only. Reachable to compose peers via internal
      # DNS (`postgres:5432`) and to the dev host via localhost. See
      # system_3 #1379.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../aspirant-server
      dockerfile: Dockerfile-Server
    ports:
      - "8081:8080"
    environment:
      GIN_MODE: "release"
      DB_HOST: postgres
      TRANSCRIBER_URL: http://transcriber:8000
      COMMANDER_URL: http://commander:8000
      TRANSLATOR_URL: http://translator:8000
      MONITOR_URL: http://monitor:8000
      ADVISOR_URL: http://advisor:8000
      ASSET_BASE_PATH: /data/assets
    env_file:
      - .env
    volumes:
      - filedata-dev:/data/files
      - assetdata-dev:/data/assets
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ../aspirant-client
      dockerfile: Dockerfile-Client
    ports:
      - "80:80"
      - "8999:80"
    depends_on:
      - server

  transcriber:
    build:
      context: ../aspirant-transcriber
      dockerfile: Dockerfile-Transcriber
    ports:
      # Loopback publish only. See system_3 #1379.
      - "127.0.0.1:8082:8000"
    env_file:
      - .env
    environment:
      AUDIO_STORAGE_PATH: /data/audio
      WHISPER_MODEL: base
      DB_HOST: postgres
    volumes:
      - audiodata-dev:/data/audio
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  commander:
    build:
      context: ../aspirant-commander
      dockerfile: Dockerfile-Commander
    ports:
      - "127.0.0.1:8083:8000"
    environment:
      DB_HOST: postgres
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  translator:
    build:
      context: ../aspirant-translator
      dockerfile: Dockerfile-Translator
    ports:
      - "127.0.0.1:8084:8000"
    volumes:
      - translatordata-dev:/data/models
    mem_limit: 2g

  # Mirrors docker-compose.yml: monitor reaches the Docker API through
  # a read-only socket-proxy on an internal-only bridge. See the main
  # compose file's docker-socket-proxy service comment for rationale.
  docker-socket-proxy:
    # See docker-compose.yml for pin + tmpfs rationale.
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: 1
      SYSTEM: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_proxy_net
    read_only: true
    tmpfs:
      - /run
      - /tmp
    mem_limit: 64m

  monitor:
    build:
      context: ../aspirant-monitor
      dockerfile: Dockerfile-Monitor
    ports:
      - "127.0.0.1:8085:8000"
    volumes:
      - /data:/host/data:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      DOCKER_SOCKET: tcp://docker-socket-proxy:2375
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-8}
    networks:
      - default
      - docker_proxy_net
    depends_on:
      - docker-socket-proxy

  # Dev build of the Histoire workbench straight from the sibling DS
  # checkout (prod uses the GHCR image published by the DS pre-push hook).
  histoire:
    build:
      context: ../aspirant-design-system
      dockerfile: Dockerfile.histoire
    ports:
      - "127.0.0.1:8090:80"

  advisor:
    build:
      context: ../aspirant-advisor
      dockerfile: Dockerfile-Advisor
    ports:
      - "127.0.0.1:8088:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      OLLAMA_URL: http://ollama:11434
    volumes:
      - advisordata-dev:/data/advisor
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  browser:
    build:
      context: ../aspirant-browser
      dockerfile: Dockerfile-Browser
    # Bind the dev port to loopback only so pytest / curl from the dev
    # host still work, but the service isn't reachable from the LAN.
    # See system_3 #1375: prod compose removes the mapping entirely and
    # ingress runs exclusively through aspirant-server's authed proxy.
    ports:
      - "127.0.0.1:8089:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      BROWSER_FLOW_DATA_DIR: /data/aspirant/browser_flows
      TOR_SOCKS_URL: socks5://tor:9050
    volumes:
      - filedata-dev:/data/files
      - browserdata-dev:/data/aspirant/browser_flows
    depends_on:
      postgres:
        condition: service_healthy
      tor:
        condition: service_started
    mem_limit: 2g

  tor:
    image: dperson/torproxy:latest
    mem_limit: 256m

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollamadata-dev:/root/.ollama
    mem_limit: 6g

  # --- Explorer (system_3 #2409-D2) ----------------------------------------
  # Dev builds from the sibling checkouts. The frontend needs the design system
  # as a BuildKit NAMED CONTEXT: `@aspirant/design-system` is a file: sibling
  # dependency, and the DS is compiled FROM SOURCE inside that build because its
  # dist/ is gitignored -- copying a locally-built artifact would bake something
  # untracked into the image.
  #
  # The lake boundary is identical to production: only explorer-api holds a
  # `lake` interface, and neither service publishes a port.
  explorer-api:
    profiles: ["explorer"]
    build:
      context: ../aspirant-explorer
      dockerfile: Dockerfile-Explorer
    environment:
      LAKE_CATALOG_DSN: ${LAKE_CATALOG_DSN:-postgresql://lake:lake@catalog:5432/lake}
      LAKE_S3_ENDPOINT: garage:3900
      LAKE_S3_BUCKET: ${LAKE_S3_BUCKET:-lake-skeleton-bronze}
      LAKE_S3_REGION: garage
      AWS_ACCESS_KEY_ID: ${EXPLORER_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${EXPLORER_S3_SECRET_KEY:-}
    networks:
      - default
      - lake

  explorer:
    profiles: ["explorer"]
    build:
      context: ../aspirant-explorer
      dockerfile: Dockerfile-ExplorerFrontend
      args:
        EXPLORER_BASE: /admin/explorer/
      additional_contexts:
        designsystem: ../aspirant-design-system
    depends_on:
      - explorer-api
    networks:
      - default

volumes:
  pgdata-dev:
  filedata-dev:
  assetdata-dev:
  audiodata-dev:
  translatordata-dev:
  advisordata-dev:
  browserdata-dev:
  ollamadata-dev:

networks:
  default:
  # Joined, not defined: the lake bridge belongs to the lake-skeleton compose
  # project. See docker-compose.yml for the boundary rule and its expiry.
  lake:
    external: true
    name: aspirant-lake-skeleton_lake
  # Internal-only bridge for the socket-proxy sidecar (see main compose).
  docker_proxy_net:
    internal: true
