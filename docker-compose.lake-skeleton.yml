# Phase-0 lake skeleton — Garage (S3) + a DuckLake catalog, on scratch storage.
#
# DATA_LAKE_DESIGN.md §11.1 phase 0. This stack exists to make the interface
# walkable on obviously-synthetic fixtures BEFORE encryption exists (§11.0b),
# which is only safe because it is structurally incapable of holding anything
# real:
#
#   * every byte lives under /scratch/lake-skeleton/, a path whose disposal
#     method is destruction — never /data, which is where the real lake goes;
#   * it is a SEPARATE compose project (aspirant-lake-skeleton), so the */5
#     auto-pull cron that re-ups the production project can neither upgrade it
#     nor resurrect it after teardown;
#   * it publishes NO host ports (§4) — the S3 API and the catalog are reachable
#     only from this project's own bridge network.
#
# Drive it with scripts/lake-skeleton.sh; see docs/LAKE_SKELETON.md for the
# service contract and the teardown runbook.
#
# Images are GHCR mirrors of upstream, digest-pinned: the cell cannot reach
# Docker Hub (TLS handshake timeouts over its Wi-Fi dongle), and pinning keeps
# the stack off the surprise-upgrade path that §4 calls out.

name: aspirant-lake-skeleton

services:
  garage:
    image: ghcr.io/the-anonymous-aspirant/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    container_name: lake-skeleton-garage
    restart: unless-stopped
    volumes:
      - ${LAKE_SKELETON_ROOT:-/scratch/lake-skeleton}/config:/etc/garage:ro
      - ${LAKE_SKELETON_ROOT:-/scratch/lake-skeleton}/garage/meta:/var/lib/garage/meta
      - ${LAKE_SKELETON_ROOT:-/scratch/lake-skeleton}/garage/data:/var/lib/garage/data
    environment:
      GARAGE_CONFIG_FILE: /etc/garage/garage.toml
    networks:
      - lake
    healthcheck:
      # /health is Garage's admin-API liveness endpoint; it answers without a
      # token and turns green only once a cluster layout has been applied.
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  catalog:
    image: ghcr.io/the-anonymous-aspirant/lake-catalog-postgres:16-alpine@sha256:0fc5c901ec0a3c55ce70b99b040daeb89d5b35b61febbced1b4b24dbc3153ec8
    container_name: lake-skeleton-catalog
    restart: unless-stopped
    environment:
      POSTGRES_USER: ducklake
      POSTGRES_PASSWORD: ${LAKE_CATALOG_PASSWORD:?set LAKE_CATALOG_PASSWORD}
      POSTGRES_DB: lake_catalog_skeleton
      # The database name carries `_skeleton` deliberately: the real lake's
      # catalog is `lake_catalog` in the production instance (§7), and no query
      # should ever be ambiguous about which one it hit.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${LAKE_SKELETON_ROOT:-/scratch/lake-skeleton}/catalog:/var/lib/postgresql/data
    networks:
      - lake
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ducklake -d lake_catalog_skeleton"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  duckdb:
    image: ghcr.io/the-anonymous-aspirant/aspirant-lake-duckdb:1.5.4@sha256:9dcd7396d2875f9a133ed18611f1e4d76bf4d45554cdcca22f92332177fc251a
    container_name: lake-skeleton-duckdb
    # A client, not a server: it runs on demand via `lake-skeleton.sh verify`
    # and exits. Nothing depends on it staying up.
    profiles: ["client"]
    depends_on:
      garage:
        condition: service_healthy
      catalog:
        condition: service_healthy
    environment:
      LAKE_CATALOG_DSN: postgresql://ducklake:${LAKE_CATALOG_PASSWORD:?set LAKE_CATALOG_PASSWORD}@catalog:5432/lake_catalog_skeleton
      LAKE_S3_ENDPOINT: garage:3900
      LAKE_S3_BUCKET: ${LAKE_S3_BUCKET:-lake-skeleton-bronze}
      LAKE_S3_REGION: garage
      AWS_ACCESS_KEY_ID: ${LAKE_S3_ACCESS_KEY:?set LAKE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_KEY:?set LAKE_S3_SECRET_KEY}
      # The explorer's read-only pair, passed to the client SO THAT verify can
      # try to write with it and require the attempt to fail. Defaulted rather
      # than `:?` on purpose: a skeleton brought up before this change has no
      # such keys in its env file, and the acceptance run should report that as
      # a skipped proof rather than refuse to render the whole compose file.
      EXPLORER_S3_ACCESS_KEY: ${EXPLORER_S3_ACCESS_KEY:-}
      EXPLORER_S3_SECRET_KEY: ${EXPLORER_S3_SECRET_KEY:-}
      LAKE_CATALOG_RO_DSN: ${LAKE_CATALOG_RO_DSN:-}
      # KEK for layer-2 envelope encryption of sensitivity=high blobs (§9, #4134).
      # One-shot, off-cell hex — never on disk. Defaulted rather than `:?` so a
      # skeleton with no high-sensitivity data still seeds; the fixtures loader
      # fails closed only when it actually reaches a high blob without a KEK. For
      # the synthetic skeleton a throwaway synthetic KEK is fine.
      LAKE_KEK_HEX: ${LAKE_KEK_HEX:-}
      LAKE_KEK_FINGERPRINT: ${LAKE_KEK_FINGERPRINT:-}
      LAKE_KEK_VERSION: ${LAKE_KEK_VERSION:-1}
    volumes:
      - ./scripts/lake_skeleton_verify.py:/work/verify.py:ro
      - ./scripts/lake_skeleton_fixtures.py:/work/fixtures.py:ro
      # The at-rest checker (#4299 / #4273-A1), layer 2 of #4273. Mounted at
      # /work so its own `sys.path.insert(_HERE, "kek"/"lake")` resolves
      # against the /work/kek and /work/lake mounts already below — it needs
      # no compose-side path wiring beyond sitting next to them.
      - ./scripts/lake_verify_at_rest.py:/work/verify_at_rest.py:ro
      # The REAL ingest runner (#4271), a separate writer from the synthetic
      # fixtures loader above and deliberately not a flag on it: the loader's
      # safety rests on being unmistakably fake (§11.0), and a --real switch
      # would put that one flag away from being off.
      - ./scripts/lake_ingest.py:/work/ingest.py:ro
      # The manifest and the tree it names, bind-mounted read-only at a fixed
      # path so `lake-skeleton.sh ingest <path>` needs no per-run compose edit.
      # Defaulted to the repo itself so `compose config` renders without one.
      - ${LAKE_INGEST_SOURCE:-./scripts}:/source:ro
      # The envelope machinery (dek_envelope, envelope_store, kek_loader)
      # imported by BOTH writers; mounted read-only beside them at /work/kek.
      - ./scripts/kek:/work/kek:ro
      # The catalog schema + sensitivity-intake contract (#4270), imported by
      # the loader, the verifier and the real ingest runner — they write and
      # check the same columns, and none may carry its own copy of the DDL.
      - ./scripts/lake:/work/lake:ro
    networks:
      - lake

networks:
  lake:
    # Project-local bridge. Not attached to aspirant-online_default: the
    # skeleton must not be reachable from the internet-exposed services (§9
    # threat model), and nothing in production has any business reading it.
    #
    # ONE MEDIATED EXCEPTION, since 2026-07-20 (system_3 #2409). The isolation
    # above still holds for every lake service -- garage and catalog remain
    # unreachable from the public ingress by any route. What changed is that
    # `explorer-api` in docker-compose.yml joins THIS bridge as an external
    # network while also sitting on `default`, so an authenticated user can be
    # shown the lake's contents without the lake itself being exposed.
    #
    # Operator ruling, verbatim: "The lake itself should not be visible to the
    # public api. However, the explorer should, for a user that has logged in,
    # be able to reveal a google-drive-like interaction and view of the data in
    # the data lake." The rule is about REACHABILITY, not network membership:
    # the public reaches the explorer, the explorer reaches the lake, and those
    # are different facts. A proxy pass-through to a lake port would violate it
    # even though it changes no network list.
    #
    # THE PERMISSION EXPIRES. It is scoped to the window in which this skeleton
    # holds only synthetic fixtures on a scratch volume, and must be re-derived
    # before real data lands -- the same trigger DATA_LAKE_DESIGN.md §11.0
    # rev 3b defines for encryption. Recorded here rather than in a task thread
    # because a permission whose expiry nobody wrote down is a permanent one.
    driver: bridge
